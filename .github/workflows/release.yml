name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs typecheck + tests + build before publishing
      - run: npm publish
